<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado! — SCA Company</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c10;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #111820;
      border: 1px solid #1e2a38;
      border-top: 3px solid #15d27d;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.03em;
      margin-bottom: 12px;
    }
    h1 span { color: #15d27d; }
    p { color: #c8d4e4; line-height: 1.6; font-size: 1rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(21,210,125,0.1);
      border: 1px solid rgba(21,210,125,0.3);
      border-radius: 100px;
      padding: 8px 20px;
      margin: 24px 0 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #15d27d;
    }
    .badge::before { content: '●'; font-size: 0.5rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>RECEBEMOS<br><span>SEU CONTATO!</span></h1>
    <div class="badge">Retorno em até 10 minutos</div>
    <p>Um especialista da SCA Company vai entrar em contato com você em breve. Fique atento ao seu telefone!</p>
  </div>
</body>
</html>
