<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado! — SCA Company</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Facebook Pixel -->
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init','966812949173995');
  fbq('track','PageView');
  // Só dispara Lead se a pessoa REALMENTE veio de um envio de formulário.
  // O event_id é gravado pela LP no momento do submit. Sem ele (acesso direto,
  // refresh, voltar/avançar, crawler do Meta) NÃO dispara — evita leads fantasmas.
  var _eid = '';
  try { _eid = sessionStorage.getItem('meta_lead_event_id') || ''; } catch(e) {}
  if (_eid) {
    fbq('track','Lead', { content_name: 'LP SCA Company' }, { eventID: _eid });
    try { sessionStorage.removeItem('meta_lead_event_id'); } catch(e) {}
  }
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=966812949173995&ev=PageView&noscript=1"/></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c10;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #111820;
      border: 1px solid #1e2a38;
      border-top: 3px solid #15d27d;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 600px;
      width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.03em;
      margin-bottom: 12px;
    }
    h1 span { color: #15d27d; }
    p { color: #c8d4e4; line-height: 1.6; font-size: 1rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(21,210,125,0.1);
      border: 1px solid rgba(21,210,125,0.3);
      border-radius: 100px;
      padding: 8px 20px;
      margin: 24px 0 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #15d27d;
    }
    .badge::before { content: '●'; font-size: 0.5rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .video-label {
      color: #8a9ab0;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 28px 0 12px;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e2a38;
    }
    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>RECEBEMOS<br><span>SEU CONTATO!</span></h1>
    <div class="badge">Retorno em até 10 minutos</div>
    <p>Um especialista da SCA Company vai entrar em contato com você em breve. Fique atento ao seu telefone!</p>

    <p class="video-label">Enquanto isso, assista:</p>
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/fIOJK8EPlMo?autoplay=1&mute=0&rel=0"
        title="SCA Company"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</body>
</html>
